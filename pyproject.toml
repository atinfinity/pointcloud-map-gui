[project]
name = "pointcloud-map-gui"
version = "0.1.0"
description = "Point cloud to ROS2 occupancy grid map GUI exporter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "atinfinity" },
]
# Upper bound: Open3D 0.19.0 (the latest release) ships wheels only up to cp312
# and has no sdist, so 3.13+ cannot install it.
requires-python = ">=3.10,<3.13"
dependencies = [
    "open3d",
    "numpy",
    "pyyaml",
    "cloth-simulation-filter>=1.1.7",
    "scipy>=1.15.3",
]

[project.scripts]
pointcloud-map-gui = "pointcloud_map_gui.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pointcloud_map_gui"]

[tool.ruff]
src = ["src", "tests"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.15.20",
]
